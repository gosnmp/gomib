name: Fuzz

on:
  schedule:
    - cron: '0 2 * * 1,4'  # Mon/Thu at 2am

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzTokenize
          - FuzzCSTParseModule
          - FuzzCSTConstraintParsing
          - FuzzResolutionOrder
          - FuzzParseOID
          - FuzzFormatOID
          - FuzzParse
          - FuzzPipeline
          - FuzzMultiModule
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Restore fuzz corpus cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz ${{ matrix.target }}
        run: make "${{ matrix.target }}" FUZZ_TIME=30m
